<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NOVUS Market</title>

    <script>
      // Save the URL that the visitor tried to open.
      const currentPath = window.location.pathname;

      localStorage.setItem("redirectedFrom", currentPath);

      // Send the visitor back to the React application.
      window.location.replace("/react-deploy/");
    </script>
  </head>

  <body>
    <p>Redirecting to NOVUS Market...</p>
  </body>
</html>
